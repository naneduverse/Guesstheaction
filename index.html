<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Action!</title>
<style>
:root{--ink:#1f2a5c;--bg:#f3eefc;--card:#fffdf6;--line:#d9cff5;--pur:#7a5cff;--pink:#ffd6e7;--yel:#ffd45e;--box-pad:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eef0ff;--bg:#171a3b;--card:#fffdf6;--line:#3a3f78}}
:root[data-theme="dark"]{--ink:#eef0ff;--bg:#171a3b;--card:#fffdf6;--line:#3a3f78}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(rgba(122,92,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(122,92,255,.09) 1px,transparent 1px);background-size:32px 32px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:1.2vh;padding:1.4vh 1.6vw}
#top{display:flex;align-items:center;gap:2vw;min-height:15vh}
#brand{font-weight:700;font-size:clamp(14px,2.3vh,26px);line-height:1.1;color:var(--pur)}
#brand small{display:block;font-size:.62em;letter-spacing:.14em;color:var(--ink);opacity:.7}
#prompt{flex:1;text-align:center}
#prompt h1{font-size:clamp(26px,6vh,64px);line-height:1}
#prompt p{font-size:clamp(16px,3vh,34px);opacity:.8}
#reveal{display:none;flex:1;text-align:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
#reveal small{font-size:clamp(14px,2.6vh,28px);opacity:.75}
#reveal b{display:block;font-size:clamp(40px,10vh,110px);line-height:1;letter-spacing:.04em;color:var(--pur)}
#reveal i{font-style:normal;font-size:clamp(18px,3.6vh,40px);background:var(--yel);color:#3a2a00;padding:0 .7em;border-radius:99px}
#round{font-weight:700;font-size:clamp(14px,2.6vh,28px);background:var(--ink);color:var(--bg);padding:.5em 1em;border-radius:99px;white-space:nowrap}
.rv #prompt{display:none}.rv #reveal{display:block}
#stagewrap{flex:1;min-height:30vh;position:relative;background:var(--card);border-radius:28px;box-shadow:0 10px 30px rgba(31,42,92,.18);border:3px solid var(--line);overflow:hidden;display:flex}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;display:block}#err{position:absolute;left:10px;top:10px;right:10px;background:#fee;color:#900;font:14px monospace;padding:8px;border-radius:8px;z-index:3;white-space:pre-wrap}
.fg{filter:drop-shadow(0 0 1.2px #243a7a)}
#ctl{display:flex;gap:1.2vw;align-items:center;justify-content:center;min-height:9vh;flex-wrap:wrap}
button{font:inherit;font-weight:700;border:0;border-radius:18px;cursor:pointer;color:#fff;padding:.5em 1.1em;font-size:clamp(14px,3vh,32px);box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .12s}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
button:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
#rv{background:var(--pur)}#sk{background:#8b93b8}#nx{background:#ff6fa3;display:none}
#who{display:none;align-items:center;gap:1vw;flex-wrap:wrap;justify-content:center}
#who h2{font-size:clamp(14px,3vh,30px)}
.g1{background:#8b5cf6}.g2{background:#3b82f6}.g3{background:#16a34a}.g4{background:#d4a50a}.g5{background:#ea6a12}
#sb{display:flex;gap:1vw;justify-content:center}
.chip{flex:1;max-width:19vw;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:.3em .6em;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:clamp(13px,2.6vh,28px);color:#1f2a5c;position:relative}
.chip b{font-size:1.5em}
.chip.up b{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
.toast{position:absolute;left:50%;top:-1.6em;transform:translateX(-50%);color:#16a34a;font-weight:700;animation:fl 1.1s forwards;white-space:nowrap}
@keyframes fl{to{top:-3.4em;opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#fin{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;text-align:center;z-index:5;padding:3vh}
#fin[hidden]{display:none}
#fin h1{font-size:clamp(32px,9vh,90px)}#fin h3{font-size:clamp(18px,4vh,40px);font-weight:500}
#fin .row{display:flex;gap:1.5vw;flex-wrap:wrap;justify-content:center}
#fin .chip{max-width:none;flex:none;min-width:16vw}
#fin .chip.win{background:var(--yel);border-color:#e0a800;transform:scale(1.12)}
#champ{font-size:clamp(20px,5vh,52px);font-weight:700;color:var(--pur)}
.cf{position:fixed;top:-5vh;width:1.2vh;height:2vh;animation:cf linear infinite;z-index:6;pointer-events:none}
@keyframes cf{to{transform:translateY(112vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
@media (max-width:640px){#top{flex-wrap:wrap}#brand{display:none}.chip{max-width:none}}
</style>
</head>
<body>
<div id="app">
 <div id="top">
  <div id="brand">GUESS THE ACTION!<small>LOOK • THINK • GUESS</small></div>
  <div id="prompt"><h1>👀 WATCH CAREFULLY!</h1><p>What is the action?</p></div>
  <div id="reveal"><small>THE ANSWER IS...</small><b id="aw">SWEEP</b><i id="id">Menyapu</i></div>
  <div id="round">ROUND 01 / 30</div>

 <div id="ctl">
  <button id="rv" class="" type="button">🔍 REVEAL ANSWER</button>
  <button id="sk" type="button">SKIP</button>
  <div id="who"><h2>🏆 WHO GETS THE POINT?</h2>
   <button class="g1" data-g="0">🟣 GROUP 1</button><button class="g2" data-g="1">🔵 GROUP 2</button><button class="g3" data-g="2">🟢 GROUP 3</button><button class="g4" data-g="3">🟡 GROUP 4</button><button class="g5" data-g="4">🟠 GROUP 5</button>
  </div>
  <button id="nx" type="button">NEXT ACTION →</button>
 </div>
 <div id="sb"></div>
</div>
<div id="fin" hidden>
 <h1>🎉 GREAT JOB!</h1><h3>YOU COMPLETED ALL 30 ACTIONS!</h3>
 <div class="row" id="fsb"></div>
 <div id="champ"></div>
 <button id="pa" style="background:var(--pur)" type="button">PLAY AGAIN</button>
</div>
<script>

const S=Math.sin,C=Math.cos,D=Math.PI/180,mx=Math.max,SK='#c68a62';

const sweeper=(T,mop)=>{const w=T*(mop?2.2:4),hx=300+30*S(w),p=P({x:hx,ta:14,ll:[20,20],rl:[22,20],fd:1}),s=sho(p),top=[s.sx+30,s.sy+62],bx=hx+175+(mop?40:55)*S(w-1),bot=[bx,mop?400:402],pt=f=>[top[0]+f*(bot[0]-top[0]),top[1]+f*(bot[1]-top[1])],h1=pt(.04),h2=pt(.22);p.la={t:[h2[0],h2[1]]};p.ra={t:[h1[0],h1[1]]};
